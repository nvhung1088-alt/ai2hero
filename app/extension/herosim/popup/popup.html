<!DOCTYPE html>
<html lang="vi" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HeroSim Vault</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- TRẠNG THÁI 1: Chưa đăng nhập (LoggedOut) -->
  <div id="state-logged-out" class="state" style="display:none">
    <div class="header">
      <div class="logo">
        <img src="../icons/icon48.png" alt="HeroSim" class="logo-icon">
        <div>
          <div class="logo-title">HeroSim</div>
          <div class="logo-sub">by AI2Hero</div>
        </div>
      </div>
      <div class="badge badge-new">Đăng nhập</div>
    </div>

    <div class="form-container">
      <div class="section">
        <label class="section-label" for="login-email">Email tài khoản</label>
        <input
          id="login-email"
          class="input"
          type="email"
          placeholder="email@example.com"
          autocomplete="username"
          spellcheck="false"
        >
      </div>

      <div class="section">
        <label class="section-label" for="login-password">Mật khẩu ai2hero.com</label>
        <div class="password-input-wrap">
          <input
            id="login-password"
            class="input"
            type="password"
            placeholder="••••••••"
            autocomplete="current-password"
          >
          <button id="toggle-login-password" class="toggle-password-btn" type="button">👁</button>
        </div>
        <div class="hint">Đăng nhập trực tiếp bằng tài khoản web của bạn.</div>
      </div>

      <button id="btn-login" class="btn btn-primary" type="button">
        <span id="login-spinner" class="spinner" style="display:none"></span>
        <span>Đăng nhập</span>
      </button>

      <div id="login-error" class="error-msg" style="display:none"></div>
    </div>
  </div>

  <!-- TRẠNG THÁI 2: Chọn Workspace (SelectWorkspace) -->
  <div id="state-select-workspace" class="state" style="display:none">
    <div class="header">
      <div class="logo">
        <img src="../icons/icon48.png" alt="HeroSim" class="logo-icon">
        <div>
          <div class="logo-title">HeroSim</div>
          <div class="logo-sub">Không gian làm việc</div>
        </div>
      </div>
    </div>

    <div class="form-container">
      <div class="section">
        <div class="section-label">Chọn không gian làm việc</div>
        <div class="hint">Tài khoản SIM & mật khẩu sẽ được đồng bộ theo không gian này.</div>
        
        <div id="workspace-list" class="workspace-list">
          <!-- Workspaces radio list chèn động ở đây -->
        </div>
      </div>

      <button id="btn-select-workspace" class="btn btn-primary" type="button">
        <span id="workspace-spinner" class="spinner" style="display:none"></span>
        <span>Kết nối & Đồng bộ</span>
      </button>

      <div id="workspace-error" class="error-msg" style="display:none"></div>
      
      <button id="btn-workspace-back" class="btn btn-ghost" type="button">Quay lại</button>
    </div>
  </div>

  <!-- TRẠNG THÁI 3: Đã khóa (Locked) -->
  <div id="state-locked" class="state" style="display:none">
    <div class="header">
      <div class="logo">
        <img src="../icons/icon48.png" alt="HeroSim" class="logo-icon">
        <div>
          <div class="logo-title">HeroSim</div>
          <div id="locked-team-name" class="logo-sub"></div>
        </div>
      </div>
      <div class="badge badge-lock">🔒 Đã khóa</div>
    </div>

    <div class="lock-illustration">
      <div class="lock-icon">🛡️</div>
      <div class="lock-text">Nhập mật khẩu để mở khóa vault</div>
    </div>

    <div class="form-container">
      <div class="section">
        <div class="password-input-wrap">
          <input
            id="unlock-password"
            class="input"
            type="password"
            placeholder="Mật khẩu của bạn"
            autocomplete="current-password"
            autofocus
          >
          <button id="toggle-unlock-password" class="toggle-password-btn" type="button">👁</button>
        </div>
      </div>

      <button id="btn-unlock" class="btn btn-primary" type="button">
        <span id="unlock-spinner" class="spinner" style="display:none"></span>
        <span>Mở khóa</span>
      </button>

      <div id="unlock-error" class="error-msg" style="display:none"></div>

      <button id="btn-logout-locked" class="btn btn-ghost" type="button">Đăng xuất</button>
    </div>
  </div>

  <!-- TRẠNG THÁI 4: Bảng điều khiển (Dashboard) -->
  <div id="state-dashboard" class="state" style="display:none">
    <div class="header">
      <div class="logo">
        <img src="../icons/icon48.png" alt="HeroSim" class="logo-icon">
        <div>
          <div class="logo-title">HeroSim</div>
          <!-- Dropdown chọn nhanh workspace -->
          <div class="workspace-switcher-wrap">
            <select id="dashboard-workspace-select" class="workspace-select-dropdown">
              <!-- Chèn danh sách workspace động -->
            </select>
          </div>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-sync" class="icon-btn" title="Đồng bộ ngay">↻</button>
        <button id="btn-lock" class="icon-btn" title="Khóa vault">🔒</button>
        <button id="btn-logout" class="icon-btn" title="Đăng xuất">🚪</button>
      </div>
    </div>

    <div class="search-wrap">
      <input
        id="search-input"
        class="input input-search"
        type="text"
        placeholder="🔍 Tìm tài khoản..."
        autocomplete="off"
      >
    </div>

    <div id="accounts-list" class="accounts-list">
      <div class="loading-msg">Đang tải tài khoản...</div>
    </div>

    <div id="sync-status" class="sync-status"></div>
  </div>

  <!-- Hộp thoại Toast Notification toàn cục -->
  <div id="toast" class="toast" style="display:none"></div>

  <script src="popup.js"></script>
</body>
</html>
