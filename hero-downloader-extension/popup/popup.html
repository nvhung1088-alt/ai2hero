<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>AI2Hero Downloader</title>
    <style>
        body { width: 320px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; margin: 0; background: #0f172a; color: #f8fafc; }
        h3 { margin-top: 0; color: #38bdf8; font-size: 18px; text-align: center; border-bottom: 1px solid #1e293b; padding-bottom: 10px; }
        .info { background: #1e293b; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 15px; }
        .count { font-size: 28px; font-weight: bold; color: #10b981; margin: 5px 0; }
        .label { font-size: 13px; color: #94a3b8; }
        button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 6px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #2563eb; }
        button:disabled { background: #475569; cursor: not-allowed; }
        .footer { text-align: center; margin-top: 15px; font-size: 11px; color: #64748b; }
        .status { margin-top: 10px; font-size: 13px; text-align: center; color: #10b981; display: none; }
        .status.error { color: #ef4444; }
    </style>
</head>
<body>
    <h3>Hero Downloader Pro</h3>
    
    <div class="info">
        <div class="label">Video phát hiện ở trang này</div>
        <div class="count" id="videoCount">0</div>
        <div class="label">Lướt xem kênh để lấy thêm!</div>
    </div>

    <button id="btnSend" disabled>Đồng bộ sang Dashboard</button>
    <div id="statusMsg" class="status"></div>

    <div class="footer">Dành riêng cho AI2Hero Platform</div>

    <script src="popup.js"></script>
</body>
</html>
